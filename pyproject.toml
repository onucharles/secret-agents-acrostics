[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stego"
version = "0.1.0"
description = "Steganographic post-training: hidden-message channels, rewards and training code"
readme = "README.md"
requires-python = ">=3.10"
# The core package (channels + rewards) is pure Python so it installs instantly on Colab.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Colab already ships torch, transformers and datasets; these pins make sure
# they are new enough (Qwen3 needs transformers >= 4.51; `dtype=` needs 4.56).
torch = ["torch"]
gen = ["torch", "transformers>=4.56", "accelerate", "datasets"]
teacher = ["anthropic>=1.11"]

[tool.setuptools.packages.find]
include = ["stego*"]

[tool.setuptools.package-data]
"stego.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
